name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Shopify
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest
      - name: Get Shopify token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://brightfield-2.myshopify.com/admin/oauth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"${{ secrets.SHOPIFY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.SHOPIFY_CLIENT_SECRET }}\"}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "SHOPIFY_CLI_THEME_TOKEN=$TOKEN" >> $GITHUB_ENV
      - name: Push theme
        run: |
          shopify theme push \
            --store brightfield-2.myshopify.com \
            --theme ${{ secrets.SHOPIFY_THEME_ID }} \
            --allow-live \
            --force

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_URL: https://brightfield.studio

  cleanup-e2e:
    name: Cleanup E2E Test Products
    runs-on: ubuntu-latest
    needs: e2e
    # always() so orphaned e2e-test products still get deleted on a flaky/failed
    # e2e run; the ref check keeps this from firing on PR runs (where e2e itself
    # is skipped and there's nothing to clean up).
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete e2e-test tagged products
        run: node scripts/cleanup-e2e-products.mjs
        env:
          SHOPIFY_CUSTOM_DESIGN_CLIENT_ID: ${{ secrets.SHOPIFY_CUSTOM_DESIGN_CLIENT_ID }}
          SHOPIFY_CUSTOM_DESIGN_CLIENT_SECRET: ${{ secrets.SHOPIFY_CUSTOM_DESIGN_CLIENT_SECRET }}
