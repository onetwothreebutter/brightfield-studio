<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shader Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Azeret+Mono:wght@900&family=Barlow+Condensed:wght@700&family=Bebas+Neue&family=Fjalla+One&family=Big+Shoulders+Display:wght@700&family=Bricolage+Grotesque:wght@800&family=Courier+Prime:wght@700&family=Cutive+Mono&family=DM+Mono:wght@500&family=DM+Sans:wght@900&family=Epilogue:wght@900&family=Fira+Code:wght@700&family=Fragment+Mono&family=Geist+Mono:wght@900&family=IBM+Plex+Mono:wght@700&family=Inconsolata:wght@900&family=JetBrains+Mono:wght@800&family=Montserrat:wght@900&family=Orbitron:wght@700&family=Oswald:wght@700&family=Playfair+Display:wght@700&family=Righteous&family=Roboto+Mono:wght@700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@900&family=Space+Mono:wght@700&family=Spline+Sans+Mono:wght@700&family=Syne:wght@800&family=Teko:wght@500&family=Unbounded:wght@900" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #111;
      color: #eee;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #0d0d0d;
      border-bottom: 1px solid #2a2a2a;
    }
    #topbar label {
      color: #666;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #shader-picker {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 3px;
      color: #0cf;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }

    #export-btn {
      margin-left: auto;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 3px;
      color: #0cf;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #export-btn:hover { border-color: #0cf; }
    #export-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Main layout ── */
    #main {
      flex: 1 1 auto;
      display: flex;
      overflow: hidden;
    }

    /* ── Canvas ── */
    #canvas-wrap {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #000;
    }
    #shader-canvas {
      display: block;
      width: 720px;
      height: 960px;
    }

    /* ── Controls panel ── */
    #panel {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 10px 12px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      min-width: 260px;
      max-width: 320px;
    }

    /* Control-panel styles live in assets/shader-gui.js, which injects them. */
  </style>
</head>
<body>

<div id="topbar">
  <label for="shader-picker">Shader</label>
  <select id="shader-picker">
    <option value="rise-shirt">Rise Shirt</option>
    <option value="chladni">Chladni</option>
    <option value="circle-on-line">Circle On Line</option>
    <option value="line-circle">Line Circle</option>
    <option value="three-square">Three Square</option>
    <option value="stacked-gradient">Stacked Gradient</option>
    <option value="echo-text">Echo Text</option>
    <option value="four-circles">Four Circles</option>
    <option value="line-text">Line Text</option>
    <option value="scaling-letters">Scaling Letters</option>
    <option value="outline-pulse">Outline Pulse</option>
    <option value="contour-pareidolia">Contour Pareidolia</option>
    <option value="scribble-glyph">Scribble Glyph</option>
    <option value="radial-tick-ring">Radial Tick Ring</option>
  </select>
  <button id="export-btn">Export PNG</button>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="shader-canvas"></canvas>
  </div>
  <div id="panel">
    <div id="shader-gui-body"></div>
  </div>
</div>

<script src="assets/shader-base.js"></script>
<script src="assets/shader-defs.js"></script>
<script src="assets/shader-gui.js"></script>

<script>

// ── Radial Tick Ring ──────────────────────────────────────────────────────────
SHADERS['radial-tick-ring'] = {
  controls: [
    { type: 'header', label: 'Ring' },
    { key: 'u_ring_radius', label: 'Ring Radius', type: 'range', min: 0.05, max: 0.5, step: 0.01, value: 0.33, noRandomize: true,
      tip: 'Above about 0.33 the ring runs off the left and right edges — the canvas is taller than it is wide.' },
    { key: 'u_tick_count', label: 'Tick Count', type: 'range', min: 4, max: 180, step: 1, value: 48 },
    { key: 'u_tick_length', label: 'Tick Length', type: 'range', min: 0.005, max: 0.25, step: 0.005, value: 0.05 },
    { key: 'u_tick_width', label: 'Tick Width', type: 'range', min: 0.002, max: 0.08, step: 0.002, value: 0.010 },
    { key: 'u_width_gradient', label: 'Width Gradient', type: 'range', min: 0, max: 1, step: 0.01, value: 0.0,
      tip: 'Thins the ticks at the gradient origin, returning to full Tick Width on the opposite side.' },
    { key: 'u_width_gradient_strength', label: 'Width Gradient Strength', type: 'range', min: 1, max: 4, step: 0.05, value: 1.0,
      tip: 'How much thicker than Tick Width the ticks get on the far side of the gradient. 1 caps them at Tick Width.' },
    { key: 'u_width_gradient_rotation', label: 'Width Gradient Rotation', type: 'range', min: 0, max: 1, step: 0.005, value: 0.0,
      tip: 'Rotates the gradient, moving the thin end around the ring. 0 places it at the top.' },
    { key: 'u_tick_phase', label: 'Rotation', type: 'range', min: 0, max: 1, step: 0.005, value: 0.0,
      tip: 'Rotates the whole sunburst by up to one tick spacing.' },
    { key: 'u_tick_major_every', label: 'Major Tick Every', type: 'range', min: 1, max: 12, step: 1, value: 5 },
    { key: 'u_tick_major_scale', label: 'Major Tick Length', type: 'range', min: 1.0, max: 4.0, step: 0.05, value: 1.8 },
    { key: 'u_gap_size', label: 'Gap Size', type: 'range', min: 0, max: 270, step: 1, value: 0, randomMax: 120,
      tip: 'Clears a wedge of the ring, in degrees. 0 leaves the ring closed.' },
    { key: 'u_gap_position', label: 'Gap Position', type: 'range', min: 0, max: 1, step: 0.005, value: 0.0, noRandomize: true,
      tip: 'Rotates the gap around the ring. 0 places it at the top.' },
    { type: 'header', label: 'Inner Circle' },
    { key: 'u_inner_radius', label: 'Radius', type: 'range', min: 0.0, max: 0.45, step: 0.005, value: 0.16, randomMax: 0.25 },
    { key: 'u_inner_x', label: 'Position X', type: 'range', min: -0.5, max: 0.5, step: 0.005, value: 0.0, noRandomize: true },
    { key: 'u_inner_y', label: 'Position Y', type: 'range', min: -0.5, max: 0.5, step: 0.005, value: 0.0, noRandomize: true },
    { type: 'header', label: 'Knockout' },
    { key: 'u_knockout_enabled', label: 'Enabled', type: 'toggle', value: 1, noRandomize: true },
    { key: 'u_knockout_radius', label: 'Radius', type: 'range', min: 0.0, max: 0.45, step: 0.005, value: 0.06, randomMax: 0.15 },
    { type: 'header', label: 'Color Palette' },
    { key: 'u_color_mode', label: '4-Color Mode', type: 'toggle', value: 0,
      tip: 'Off = cosine palette. On = 4-stop linear gradient from center outward.' },
    { key: '_rtr_palette_preset', label: 'Preset', type: 'select', paletteDependent: true, value: 'Rainbow',
      options: [
        { label: 'Rainbow',   value: 'Rainbow'   },
        { label: 'Cool Blue', value: 'Cool Blue' },
        { label: 'Neon Heat', value: 'Neon Heat' },
        { label: 'Cyberpunk', value: 'Cyberpunk' },
        { label: 'Golden',    value: 'Golden'    },
      ]
    },
    { key: 'u_a', label: 'Palette A', type: 'color', paletteDependent: true, value: '#808080', tip: 'Offset.' },
    { key: 'u_b', label: 'Palette B', type: 'color', paletteDependent: true, value: '#808080', tip: 'Amplitude.' },
    { key: 'u_c', label: 'Palette C', type: 'color', paletteDependent: true, value: '#ffffff', tip: 'Frequency.' },
    { key: 'u_d', label: 'Palette D', type: 'color', paletteDependent: true, value: '#0054ab', tip: 'Phase.' },
    { key: '_rtr_4color_preset', label: 'Preset', type: 'select', stopDependent: true, value: 'Neon',
      options: [
        { label: 'Neon',   value: 'Neon'   }, { label: 'Retro',  value: 'Retro'  },
        { label: 'Sunset', value: 'Sunset' }, { label: 'Aurora', value: 'Aurora' },
        { label: 'Dusk',   value: 'Dusk'   },
      ]
    },
    { key: 'u_color0', label: 'Color 1 (Center)', type: 'color', stopDependent: true, value: '#ff3366' },
    { key: 'u_color1', label: 'Color 2',          type: 'color', stopDependent: true, value: '#ffcc00' },
    { key: 'u_color2', label: 'Color 3',          type: 'color', stopDependent: true, value: '#00ccff' },
    { key: 'u_color3', label: 'Color 4 (Edge)',   type: 'color', stopDependent: true, value: '#aa00ff' },
    { key: 'u_use_ring_color', label: 'Custom Ring Color', type: 'toggle', value: 0, noRandomize: true },
    { key: 'u_ring_color', label: 'Ring Color', type: 'color', value: '#ffffff' },
    { key: 'u_use_inner_color', label: 'Custom Inner Color', type: 'toggle', value: 0, noRandomize: true },
    { key: 'u_inner_color', label: 'Inner Color', type: 'color', value: '#ffffff' },
  ].concat(FINISH_CONTROLS),
  fonts: [],
  customAfterBuild: function (body) {
    var cosinePresets = {
      'Rainbow':   { a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[1.0,1.0,1.0], d:[0.0,  0.33, 0.67]  },
      'Cool Blue': { a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[1.0,1.0,1.0], d:[0.263,0.416,0.557] },
      'Neon Heat': { a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[1.0,1.0,1.0], d:[0.3,  0.2,  0.2 ]  },
      'Cyberpunk': { a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[2.0,1.0,0.0], d:[0.5,  0.2,  0.25]  },
      'Golden':    { a:[0.5,0.5,0.5], b:[0.5,0.5,0.5], c:[1.0,1.0,0.5], d:[0.8,  0.9,  0.3 ]  },
    };
    var fourStopPresets = {
      'Neon':   { c0:[1.0, 0.2,  0.4  ], c1:[1.0,  0.8,   0.0  ], c2:[0.0,  0.8,   1.0  ], c3:[0.667,0.0,  1.0  ] },
      'Retro':  { c0:[0.91,0.286,0.114], c1:[0.788,0.627, 0.188], c2:[0.176,0.541, 0.369], c3:[0.102,0.153,0.267] },
      'Sunset': { c0:[1.0, 0.318,0.184], c1:[0.867,0.141, 0.463], c2:[0.541,0.169, 0.886], c3:[0.098,0.098,0.439] },
      'Aurora': { c0:[0.0, 1.0,  0.533], c1:[0.0,  0.898,  1.0 ], c2:[0.486,0.302,  1.0 ], c3:[0.878,0.251,0.984] },
      'Dusk':   { c0:[1.0, 0.6,  0.4  ], c1:[1.0,  0.369, 0.384], c2:[0.8,  0.169, 0.369], c3:[0.459,0.227,0.533] },
    };
    var cosineKeys = ['u_a', 'u_b', 'u_c', 'u_d'];
    function applyColors(pairs) {
      pairs.forEach(function(pair) {
        var key = pair[0];
        var stored = PALETTE_COEFF_KEYS[key] ? pair[1] : pair[1].map(srgbToLinear);
        window._shaderState.values[key] = stored;
        var inp = document.querySelector('[data-param-key="' + key + '"]');
        if (inp) inp.value = toHex(stored, key);
      });
    }
    function applyCosinePreset(p) {
      applyColors(cosineKeys.map(function(k,i){ return [k,[p.a,p.b,p.c,p.d][i]]; }));
    }
    function apply4StopPreset(p) {
      applyColors([['u_color0',p.c0],['u_color1',p.c1],['u_color2',p.c2],['u_color3',p.c3]]);
    }
    applyCosinePreset(cosinePresets['Rainbow']);
    apply4StopPreset(fourStopPresets['Neon']);
    var cSel = document.querySelector('[data-param-key="_rtr_palette_preset"]');
    if (cSel) cSel.addEventListener('change', function(){ var p=cosinePresets[this.value]; if(p) applyCosinePreset(p); });
    var fSel = document.querySelector('[data-param-key="_rtr_4color_preset"]');
    if (fSel) fSel.addEventListener('change', function(){ var p=fourStopPresets[this.value]; if(p) apply4StopPreset(p); });

    // Per-element color overrides: show the picker row only when its toggle is on.
    function bindToggleVisibility(toggleKey, colorKey) {
      var btn = body.querySelector('[data-param-key="' + toggleKey + '"]');
      var picker = body.querySelector('[data-param-key="' + colorKey + '"]');
      if (!btn || !picker) return;
      var row = picker.closest('.shader-control');
      function apply() { row.style.display = btn.dataset.on === '1' ? '' : 'none'; }
      btn.addEventListener('click', apply);
      // Randomize sets data-on directly instead of clicking, so watch the
      // attribute too rather than relying on the click event alone.
      new MutationObserver(apply).observe(btn, { attributes: true, attributeFilter: ['data-on'] });
      apply();
    }
    bindToggleVisibility('u_use_ring_color', 'u_ring_color');
    bindToggleVisibility('u_use_inner_color', 'u_inner_color');
  },
};

// ── Bootstrap ─────────────────────────────────────────────────────────────────
var params     = new URLSearchParams(window.location.search);
var shaderName = params.get('shader') || 'echo-text';
var shaderDef  = window.ShaderDefs.SHADERS[shaderName];

// Set dropdown to match current shader
var picker = document.getElementById('shader-picker');
picker.value = shaderName;
picker.addEventListener('change', function () {
  window.location.href = '?shader=' + this.value;
});

var exportBtn = document.getElementById('export-btn');
exportBtn.addEventListener('click', function () {
  if (!window._shaderExport) return;
  exportBtn.disabled = true;
  exportBtn.textContent = 'Exporting…';
  window._shaderExport(3000, 4000, function (b64) {
    var a = document.createElement('a');
    a.href = 'data:image/png;base64,' + b64;
    a.download = shaderName + '-3000.png';
    a.click();
    exportBtn.disabled = false;
    exportBtn.textContent = 'Export PNG';
  });
});

if (shaderDef) {
  // Initialise shared state from controls defaults
  var values = {};
  shaderDef.controls.forEach(function(c) {
    if (!c.key) return;
    values[c.key] = c.type==='color'
      ? window.ShaderDefs.hexToRgb(c.value, c.key)
      : (c.toRadians ? c.value*Math.PI/180 : c.value);
  });
  window._shaderState = { values: values, textDirty: true };

  // Dynamically load the shader script, then build the GUI
  var s = document.createElement('script');
  s.src = 'assets/' + shaderName + '.js';
  s.onload = function () {
    window.ShaderGUI.build(document.getElementById('shader-gui-body'), shaderDef);
  };
  document.head.appendChild(s);
}
</script>

</body>
</html>
