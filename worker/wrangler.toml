name = "brightfield-mockup-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

routes = [
  { pattern = "share.brightfield.studio", custom_domain = true }
]

[observability.logs]
enabled = true
invocation_logs = true

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "MOCKUP_STAGING"
preview_bucket_name = "mockup-staging"
bucket_name = "mockup-staging"

# ── Garbage collection (issue #550) ─────────────────────────────────────────
# Daily sweep of abandoned custom-design/community-design products (created
# by createShopifyProduct(), see index.js) that have zero orders, plus their
# now-orphaned R2 blobs. See index.js `scheduled()` / runGc() for the full
# logic and safety model.
[triggers]
crons = ["0 6 * * *"]

# GC_DRY_RUN gates the actual productDelete/R2 delete calls the cron job
# makes (see gcIsDryRun() in index.js). Unset — as it is right now — means
# dry-run: the job still runs on schedule and logs exactly what it would
# delete, but deletes nothing. It must be set to the literal string "false"
# below to make deletion live.
#
# Do NOT uncomment this until a human has reviewed dry-run output (via
# GET /admin/gc-dry-run, or the cron job's own logs) against real order data
# and is satisfied nothing that should survive would be deleted. This is a
# deploy-owner decision, not something to flip as part of shipping this
# feature — see the PR description for issue #550.
# [vars]
# GC_DRY_RUN = "false"

# ── Rate limiting (Workers Rate Limiting binding, GA since 2025-09-19) ──────
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# Per-key sliding-window limiter, created automatically on deploy — no separate
# resource provisioning (unlike the R2 bucket above). `period` only accepts 10
# or 60 (seconds). One binding per endpoint since limit/period are fixed per
# binding and each endpoint below warrants a different threshold; see
# index.js checkRateLimit() for the CF-Connecting-IP-keyed usage and PR
# description for why these specific limits were chosen.
# namespace_id just needs to be a positive integer unique within this account;
# these are arbitrary and only need to stay stable once deployed.
[[ratelimits]]
name = "RATE_LIMITER_CREATE_PRODUCT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RATE_LIMITER_SAVE_PREVIEW"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RATE_LIMITER_GENERATE_MOCKUP"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Reviews are a common spam target and cost nothing to attempt repeatedly (no
# image upload, no Shopify Admin API call on the write path itself), so this
# gets the tightest limit of the bunch.
[[ratelimits]]
name = "RATE_LIMITER_REVIEWS_SUBMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 5
  period = 60

# Required secrets (set via: npx wrangler secret put SECRET_NAME)
#   ADMIN_TOKEN                - static fallback token for tests / CLI use
#   PRINTFUL_API_KEY           - Printful API key
#   R2_PUBLIC_DOMAIN           - public R2 bucket domain
#   SHOPIFY_APP_CLIENT_ID      - from Shopify custom app (Settings → Apps → Develop apps)
#   SHOPIFY_APP_CLIENT_SECRET  - from Shopify custom app (used to verify App Bridge JWTs)
#   SHOPIFY_STORE_DOMAIN       - e.g. brightfield-2.myshopify.com
#   SHOPIFY_CUSTOM_DESIGN_CLIENT_ID     - custom-design app client ID (for Admin API product creation)
#   SHOPIFY_CUSTOM_DESIGN_CLIENT_SECRET - custom-design app client secret (for Admin API product creation)
#   DEVICE_ID_SECRET           - HMAC key used to sign client deviceIds (see
#                                 signDeviceId/verifyDeviceToken in index.js, #544).
#                                 Any long random string; not shared with any other
#                                 system. Until this is set, device-token minting/
#                                 verification silently no-ops (fail open) rather
#                                 than hard-breaking /delete-design or /community/like.
#
# The SHOPIFY_CUSTOM_DESIGN_CLIENT_* app (above) additionally needs the
# `read_orders` access scope for the GC job's per-SKU orders(query: "sku:...")
# check (see runGc() in index.js) to succeed — verify this in Shopify admin
# under the app's configuration before relying on GC_DRY_RUN=false. If the
# scope is missing, that check fails closed (treated as "can't verify — keep
# the product"), so a missing scope means GC silently deletes nothing rather
# than deleting something it shouldn't — but it also means GC won't do its
# job until the scope is granted.
